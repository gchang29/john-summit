name: Track John Summit GA prices

on:
  schedule:
    # Every 30 minutes. GitHub may run scheduled jobs a few minutes late.
    - cron: "*/30 * * * *"
  workflow_dispatch: # lets you hit "Run workflow" manually
    inputs:
      test_email:
        description: "Just send a test email (to check it arrives and isn't in spam)"
        type: boolean
        default: false

permissions:
  contents: write # to save price history back into the repo

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    # Pinned: ubuntu-latest switches to Ubuntu 26 on Oct 19, mid-tracking.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Send test email
        if: inputs.test_email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m tracker --test-notify

      - name: Check ticket sites
        if: ${{ !inputs.test_email }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m tracker

      - name: Save price history
        if: ${{ always() && !inputs.test_email }}
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Price check $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
