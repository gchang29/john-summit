name: Track John Summit GA prices

on:
  schedule:
    # Every 30 minutes. GitHub may run scheduled jobs a few minutes late.
    # Private repo? Free accounts get 2,000 Actions minutes/month, which this
    # schedule would use up -- switch to "0 */2 * * *" (every 2 hours) or make
    # the repo public (unlimited free minutes). See README.
    - cron: "*/30 * * * *"
  workflow_dispatch: # lets you hit "Run workflow" manually

permissions:
  contents: write # to save price history back into the repo

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check ticket sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m tracker

      - name: Save price history
        if: always()
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Price check $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
